[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astarte-device-sdk"
version = "0.1.0"
description = "Python FFI bindings for Astarte Device SDK"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Astarte Platform Team" }
]
dependencies = [
    "cffi>=1.15.0",
]
# dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# [tool.setuptools.packages.find]
# where = ["."]
# include = ["astarte*"]

# [tool.setuptools.cmdclass]
# # Custom build steps if needed for cffi modules

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

