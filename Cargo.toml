[package]
name = "astarte-device-sdk-bindings"
version = "0.1.0"
description = "Astarte device SDK bindings"
edition = "2024"
homepage = "https://astarte.cloud/"
license = "Apache-2.0"
repository = "https://github.com/astarte-platform/astarte-device-sdk-bindings"
rust-version = "1.88"
keywords = ["iot", "astarte", "ffi", "api-bindings"]

[lib]
name = "astarte_device_sdk_bindings"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["message-hub"]
# gRPC connection through the Astarte MessageHub
message-hub = ["astarte-device-sdk/message-hub", "dep:uuid"]
# Compiled in copy of the root certificate trusted by Mozilla.
webpki-roots = ["astarte-device-sdk/webpki"]
# Compiles and uses the vendored version of the C dependencies
vendored = ["astarte-device-sdk/vendored"]
# Recreates the C bindings at buildtime, requires cmake, clang, and  bindgen-cli
bindgen = ["astarte-device-sdk/bindgen"]
# Feature to make it easier to cross compile
cross = ["vendored", "bindgen"]

[dependencies]
astarte-device-sdk = { version = "0.15.1", default-features = false, features = ["interface-strict"] }
color-eyre = "0.6.5"
eyre = "0.6.12"
ffi-convert = "0.7.0"
ffi-convert-derive = "0.7.0"
rustls = "0.23.40"
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",
  "tracing",
]}
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.24.0", optional = true }

[dev-dependencies]
serde = "1.0.229"
serde_json = "1.0.151"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
  "cfg(astarte_device_bindings_docsrs)",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg=astarte_device_bindings_docsrs"]
