[package]
name = "astarte-device-sdk-bindings"
version = "0.1.0"
edition = "2021"
categories = ["api-bindings"]
documentation = "https://docs.rs/astarte-device-sdk"
homepage = "https://astarte.cloud/"
license = "Apache-2.0"
#repository = "https://github.com/astarte-platform/astarte-device-sdk-rust"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "astarte_device_sdk_bindings"
crate-type = ["staticlib", "cdylib"]

[dependencies]
astarte-device-sdk = { version = "0.11", features = ["derive", "cross"] }
aws-lc-sys = { version = "0.26.0", features = ["bindgen"], optional = true }
# uniffi = { version = "0.31.0", features = [ "cli" ] }
boltffi = "0.25"
boltffi_core = "0.25"
thiserror = "1.0"
env_logger = "*"
eyre = "*"

# Async Runtime (Required to drive the SDK)
tokio = { version = "1.36.0", features = ["rt-multi-thread"]}

log = "0.4"
url = "2.5"

[features]
bindgen = ["dep:aws-lc-sys"]

# [build-dependencies]
# uniffi = { version = "0.31.0", features = [ "build" ] }

# [[bin]]
# # This can be whatever name makes sense for your project, but the rest of this tutorial assumes uniffi-bindgen.
# name = "uniffi-bindgen"
# path = "uniffi-bindgen.rs"
