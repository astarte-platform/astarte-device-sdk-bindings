[package]
name = "astarte-device-sdk-bindings"

[targets.java]
package = "org.astarte.device.sdk.bindings"
min_version = 8  # or 16, 17, 21
module_name = "AstarteDeviceSdkBindings"

[targets.java.jvm]
enabled = true

[targets.apple]
enabled = true
output = "dist/apple"
deployment_target = "16.0"
include_macos = false

[targets.apple.swift]
module_name = "AstarteDeviceSdkBindings"
tools_version = "5.9"
error_style = "throwing"

[targets.apple.swift.type_mappings]

[targets.apple.header]

[targets.apple.xcframework]

[targets.apple.spm]
distribution = "local"
layout = "ffi-only"
skip_package_swift = false

[targets.android]
enabled = true
output = "dist/android"
min_sdk = 24
architectures = ["arm64", "x86_64"]

[targets.android.kotlin]
package = "org.astarte.device.sdk.bindings"
api_style = "top_level"
error_style = "throwing"
factory_style = "constructors"

[targets.android.kotlin.type_mappings]

[targets.android.header]

[targets.android.pack]

[targets.csharp]
enabled = true
output = "dist/csharp"

[targets.csharp.nuget]
package_id = "Astarte.Device.Sdk.Bindings"
version = "0.1.0"
authors = ["Secomind"]

[targets.csharp.bindings]
namespace = "Astarte.Device.Sdk.Bindings"

[targets.wasm]
enabled = true
triple = "wasm32-unknown-unknown"
profile = "release"
output = "dist/wasm"

[targets.wasm.optimize]

[targets.wasm.typescript.type_mappings]

[targets.wasm.npm]
